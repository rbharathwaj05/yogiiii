<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Cloak</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0d0f;
    touch-action: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="cloak"></canvas>
<script>
(function(){
  const canvas = document.getElementById('cloak');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = 1;
  let particles = [];
  const isTouchOnly = window.matchMedia('(hover: none)').matches;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false };

  function init(){
    w = window.innerWidth;
    h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;

    const step = Math.max(9, Math.min(w, h) / 22);
    particles = [];
    for (let y = step / 2; y < h; y += step){
      for (let x = step / 2; x < w; x += step){
        particles.push({
          hx: x, hy: y,
          x: x + (Math.random() - 0.5) * 4,
          y: y + (Math.random() - 0.5) * 4,
          vx: 0, vy: 0,
          r: 1 + Math.random() * 1.6
        });
      }
    }
  }

  init();
  window.addEventListener('resize', init);

  window.addEventListener('pointermove', function(e){
    pointer.tx = e.clientX;
    pointer.ty = e.clientY;
    if (!pointer.active && pointer.x === -9999){
      pointer.x = pointer.tx;
      pointer.y = pointer.ty;
    }
    pointer.active = true;
  }, { passive: true });

  window.addEventListener('pointerleave', function(){
    if (!isTouchOnly) pointer.active = false;
  }, { passive: true });

  function loop(now){
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    if (!pointer.active || isTouchOnly){
      const t = now * 0.001;
      const lx = w * (0.5 + 0.3 * Math.sin(t * 0.7));
      const ly = h * (0.5 + 0.25 * Math.sin(t * 1.1 + Math.PI / 4));
      pointer.tx = lx;
      pointer.ty = ly;
      if (pointer.x === -9999){ pointer.x = lx; pointer.y = ly; }
    }

    if (pointer.tx !== -9999){
      pointer.x += (pointer.tx - pointer.x) * 0.16;
      pointer.y += (pointer.ty - pointer.y) * 0.16;
    }

    const px = pointer.x, py = pointer.y;
    const R = 0.34 * Math.min(w, h);
    const R2 = R * R;

    for (let i = 0; i < particles.length; i++){
      const p = particles[i];
      const dx = p.x - px;
      const dy = p.y - py;
      const d2 = dx * dx + dy * dy;

      if (d2 < R2 && d2 > 0){
        const d = Math.sqrt(d2);
        const f = Math.pow(1 - d / R, 2) * 3.4;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }

      p.vx += (p.hx - p.x) * 0.024;
      p.vy += (p.hy - p.y) * 0.024;
      p.vx *= 0.86;
      p.vy *= 0.86;
      p.x += p.vx;
      p.y += p.vy;

      const dhx = p.x - p.hx;
      const dhy = p.y - p.hy;
      const distFromHome = Math.sqrt(dhx * dhx + dhy * dhy);
      const alpha = Math.max(0, 0.72 - distFromHome / 70);

      if (alpha > 0.015){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 205, 185, ${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }

    ctx.restore();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
